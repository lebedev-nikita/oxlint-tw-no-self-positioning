[package]
name = "oxlint_tw_no_self_positioning"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native Tailwind placement matcher for an Oxlint React rule"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
